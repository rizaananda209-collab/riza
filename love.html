<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#ff4d88;
overflow:hidden;
font-family:Arial;
color:white;
text-align:center;
}

h1{
font-size:60px;
animation:zoom 1.5s infinite alternate;
}

p{
font-size:25px;
}

@keyframes zoom{
from{
transform:scale(1);
}
to{
transform:scale(1.1);
}
}

.heart{
position:absolute;
color:white;
font-size:25px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

</style>

</head>
<body>

<div>

<h1>YAYYY!! ❤️</h1>

<p>I Love You Too 💖</p>

<button onclick="location.href='index.html'">Again</button>

</div>

<script>

function heart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(Math.random()*3+2)+"s";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

}

setInterval(heart,200);

</script>

</body>
</html>
